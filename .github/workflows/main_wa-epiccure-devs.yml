name: Build and deploy Node.js app to Azure Web App - WA-EpicCure-Devs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  APP_NAME: WA-EpicCure-Devs
  BACKEND_DIR: GrantManagementDatabaseSystem/backend
  NODE_VERSION: "20.x"
  PACKAGE_ZIP: api.zip

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # install & (optionally) build the BACKEND ONLY
      - name: Install backend deps
        run: npm ci
        working-directory: ${{ env.BACKEND_DIR }}

      - name: Build backend (if present)
        run: npm run build --if-present
        working-directory: ${{ env.BACKEND_DIR }}

      # zip the backend folder for deploy
      - name: Archive backend
        run: |
          cd $BACKEND_DIR
          zip -r ../${{ env.PACKAGE_ZIP }} .
      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: ${{ env.BACKEND_DIR }}/../${{ env.PACKAGE_ZIP }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api
          path: .

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_51D933B25B19416299FE0E2D5AABD025 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_15AAED1851A24134A1AB07775F7FA7B5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_811516CA868D4AA69344CC5175D0B37E }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          package: ${{ env.PACKAGE_ZIP }}
