name: Build and deploy Node.js app to Azure Web App - WA-EpicCure-Devs

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  APP_NAME: WA-EpicCure-Devs
  BACKEND_DIR: GrantManagementDatabaseSystem/backend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install backend deps
        working-directory: ${{ env.BACKEND_DIR }}
        run: npm install

      - name: Build backend
        working-directory: ${{ env.BACKEND_DIR }}
        run: npm run build --if-present

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ${{ env.BACKEND_DIR }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_61B32AAC1AC546A8B41D2E5C198C5338 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9E2BECCB556E4EBF9B5CE6133BA61146 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0F704CD91DBE4A70932F08EDD26D7D34 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          package: .
