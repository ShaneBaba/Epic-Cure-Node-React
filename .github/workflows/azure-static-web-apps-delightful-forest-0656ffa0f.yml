name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    # Run on:
    # - any push to main
    # - any PR targeting main (except when the PR is being closed)
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    permissions:
      id-token: write
      contents: read

    steps:
      # Checkout repo
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      # (Optional helper stuff Azure dropped in — harmless to keep)
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client

      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
          script: |
            const coredemo = require('@actions/core')
            return await coredemo.getIDToken()
          result-encoding: string

      #actually build the frontend so /build exists
      - name: Build frontend
        working-directory: GrantManagementDatabaseSystem/frontend
        run: |
          npm install
          npm run build

      # Deploy to Azure Static Web Apps
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          # use your real secret name 
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DELIGHTFUL_FOREST_0656FFA0F }}

          action: "upload"

          # Folder that contains your React app (and its package.json)
          app_location: "GrantManagementDatabaseSystem/frontend"

          # No API here because your backend is a separate App Service, not SWA Functions
          api_location: ""

          # Final static build output folder (relative to app_location)
          output_location: "build"

  close_pull_request_job:
    # When a PR to main is closed, tell Azure SWA to clean up preview environments
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job

    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
